name: Build PideInfo Agent

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
      platforms:
        description: 'Platforms to build (comma-separated: macos,windows,linux or "all")'
        required: false
        default: 'all'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            artifact: PideInfo-Agent-macos-arm64.dmg
          - os: windows-latest
            platform: windows-x64
            artifact: PideInfo-Agent-windows-x64-setup.exe
          - os: ubuntu-22.04
            platform: linux-x64
            artifact: PideInfo-Agent-linux-x64.AppImage

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})
    if: >-
      github.event_name == 'push' ||
      inputs.platforms == 'all' ||
      inputs.platforms == '' ||
      contains(inputs.platforms, matrix.platform)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-1 \
            libayatana-appindicator3-dev \
            libgirepository1.0-dev \
            gir1.2-appindicator3-0.1

      - name: Install Python dependencies
        working-directory: agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller packaging

      - name: Install macOS-specific dependencies
        if: runner.os == 'macOS'
        working-directory: agent
        run: pip install "pyobjc-core>=9.2" "pyobjc-framework-Cocoa>=9.2"

      - name: Install Playwright driver (no browser — downloaded at runtime)
        working-directory: agent
        run: python -c "import playwright; print('Playwright driver ready')"

      - name: Read version from version.py
        id: version
        working-directory: agent
        run: |
          VERSION=$(python -c "from version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build with PyInstaller
        working-directory: agent
        run: pyinstaller build/pideinfo-agent.spec --distpath dist --workpath build/work
        shell: bash

      # -----------------------------------------------------------------------
      # macOS: create DMG
      # -----------------------------------------------------------------------
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        working-directory: agent
        run: |
          APP="dist/PideInfo Agent.app"
          DMG_NAME="${{ matrix.artifact }}"
          hdiutil create \
            -volname "PideInfo Agent" \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

      # -----------------------------------------------------------------------
      # macOS: code signing (only if secrets are available)
      # -----------------------------------------------------------------------
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          security list-keychain -d user -s build.keychain

      - name: Sign macOS app
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        working-directory: agent
        run: |
          codesign --force --deep --options runtime \
            --entitlements build/macos/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" \
            "dist/PideInfo Agent.app"
          codesign --verify --deep --strict "dist/PideInfo Agent.app"

      - name: Notarize macOS DMG
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: agent
        run: |
          xcrun notarytool submit "${{ matrix.artifact }}" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "${{ matrix.artifact }}"

      # -----------------------------------------------------------------------
      # Windows: create NSIS installer
      # -----------------------------------------------------------------------
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $distDir = Join-Path $pwd "dist\PideInfo Agent"
          $outFile = Join-Path $pwd "${{ matrix.artifact }}"
          makensis /DVERSION=${{ steps.version.outputs.version }} "/DDIST_DIR=$distDir" "/DOUTFILE=$outFile" build\windows\installer.nsi

      # -----------------------------------------------------------------------
      # Linux: create AppImage
      # -----------------------------------------------------------------------
      - name: Generate Linux icon
        if: runner.os == 'Linux'
        working-directory: agent
        run: |
          python - <<'EOF'
          from PIL import Image, ImageDraw
          size = 256
          img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          m = int(size * 0.06)
          draw.ellipse([m, m, size - m, size - m], fill="#1D4ED8")
          draw.rectangle([size//4, size//6, size//4+size//9, size*5//6], fill="white")
          draw.ellipse([size//4, size//6, size*3//4, size//2], fill="white")
          draw.ellipse([size//4+6, size//6+6, size*3//4-6, size//2-6], fill="#1D4ED8")
          img.save("build/linux/icon.png")
          print("icon.png generated")
          EOF

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        working-directory: agent
        run: |
          # Download appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

          # Build AppDir structure
          APPDIR="dist/PideInfo-Agent.AppDir"
          mkdir -p "$APPDIR/usr/bin"

          # Copy PyInstaller output into AppDir
          cp -r "dist/PideInfo Agent/"* "$APPDIR/usr/bin/"

          # Copy AppImage metadata
          cp build/linux/pideinfo-agent.desktop "$APPDIR/"
          cp build/linux/icon.png "$APPDIR/pideinfo-agent.png"
          cp build/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Package as AppImage (--appimage-extract-and-run: FUSE unavailable on CI)
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$APPDIR" "${{ matrix.artifact }}"

      # -----------------------------------------------------------------------
      # Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: agent/${{ matrix.artifact }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release: collect all artifacts and create a GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (to read version.py and generate notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: ver
        run: |
          VERSION=$(python3 -c "exec(open('agent/version.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/agent-v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=PideInfo Agent ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "flags=" >> $GITHUB_OUTPUT
          else
            TAG="agent-dev-v${VERSION}-$(date +%Y%m%d%H%M%S)"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=PideInfo Agent v${VERSION} (dev build)" >> $GITHUB_OUTPUT
            echo "flags=--draft --prerelease" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        id: assets
        run: |
          # Flatten: upload-artifact nests each file in a directory named after the artifact
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          echo "Collected assets:"
          ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release-body.md <<'EOF'
          ### Descargas

          | Plataforma | Archivo |
          |---|---|
          | macOS (Apple Silicon + Intel vía Rosetta 2) | PideInfo-Agent-macos-arm64.dmg |
          | Windows | PideInfo-Agent-windows-x64-setup.exe |
          | Linux | PideInfo-Agent-linux-x64.AppImage |

          ### Instalación

          **macOS**: Abre el DMG y arrastra PideInfo Agent a Aplicaciones.
          Funciona en Apple Silicon y en Intel vía Rosetta 2.
          Al primer lanzamiento se descargará el navegador automáticamente (~80 MB).

          **Windows**: Ejecuta el instalador. El navegador se descarga en el primer inicio.

          **Linux**: Haz el AppImage ejecutable (`chmod +x`) y ejecútalo.
          El navegador se descarga en el primer inicio.
          EOF

          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes-file /tmp/release-body.md \
            --generate-notes \
            ${{ steps.ver.outputs.flags }} \
            release-assets/*
