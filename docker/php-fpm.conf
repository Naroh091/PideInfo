[global]
; Error log to stderr for Docker
error_log = /proc/self/fd/2
daemonize = no

[www]
; Run as www-data user
user = www-data
group = www-data

; Listen on all interfaces for flexibility
listen = 127.0.0.1:9000

; IMPORTANT: Don't clear environment variables (needed for DATABASE_URL, etc.)
clear_env = no

; Process manager configuration
; 'dynamic' spawns children based on demand
pm = dynamic

; Maximum number of child processes
; Adjust based on available memory (each worker uses ~30-50MB)
pm.max_children = 30

; Number of children created on startup
pm.start_servers = 5

; Minimum number of idle children
pm.min_spare_servers = 3

; Maximum number of idle children
pm.max_spare_servers = 10

; Number of requests before a worker is respawned (prevents memory leaks)
pm.max_requests = 500

; Maximum time a request can run before being terminated (seconds)
; This prevents long-running queries from blocking workers indefinitely
request_terminate_timeout = 300s

; Slow log for debugging (requests taking longer than this)
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Send errors to stderr
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; Security: limit access to files
php_admin_value[open_basedir] = /usr/app:/tmp:/proc

; Performance: opcache settings
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0

; Timeouts
php_admin_value[max_execution_time] = 300
php_admin_value[default_socket_timeout] = 300

; Dedicated pool for the assistant chat (/asistente/*, SSE). Caddy routes only that
; path here (docker/Caddyfile). An agentic turn (tool loop + final drafting on the
; teacher model) can run well past the 300 s above, and request_terminate_timeout
; kills the worker even with ignore_user_abort(true) — the turn was lost before its
; result was persisted. A separate pool keeps the long limit away from every other
; request and stops long turns from starving the www pool.
; Keep request_terminate_timeout below Caddy's read_timeout/write timeout for this
; route and below AssistantTurnStore::STALE_AFTER_SECONDS.
[assistant]
user = www-data
group = www-data
listen = 127.0.0.1:9001
clear_env = no

pm = ondemand
pm.max_children = 15
pm.process_idle_timeout = 60s
pm.max_requests = 200

request_terminate_timeout = 900s

; Turns are long by design: a slowlog entry per turn would be noise.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 0

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[open_basedir] = /usr/app:/tmp:/proc

php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0

php_admin_value[max_execution_time] = 900
php_admin_value[default_socket_timeout] = 300
