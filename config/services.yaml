# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mail_from_address: '%env(MAIL_FROM_ADDRESS)%'
    mail_from_name: '%env(MAIL_FROM_NAME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # AWS S3 Client for Flysystem
    aws_s3_client:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: '%env(AWS_S3_REGION)%'
              credentials:
                  key: '%env(AWS_S3_ACCESS_KEY_ID)%'
                  secret: '%env(AWS_S3_SECRET_ACCESS_KEY)%'
              http:
                  timeout: 10
              defaults_mode: 'standard'
              use_aws_shared_config_files: false

    Aws\S3\S3Client: '@aws_s3_client'

    # Markdown converter with GFM support (tables, strikethrough, etc.)
    League\CommonMark\MarkdownConverter:
        factory: ['App\Factory\MarkdownConverterFactory', 'create']

    twig.markdown.default:
        class: Twig\Extra\Markdown\LeagueMarkdown
        arguments:
            - '@League\CommonMark\MarkdownConverter'

    # Flysystem storage aliases for autowiring
    League\Flysystem\FilesystemOperator $documentsStorage: '@documents.storage'
    League\Flysystem\FilesystemOperator $defaultStorage: '@default.storage'

when@prod:
    services:
        Redis:
            class: \Predis\Client
            arguments:
                - '%env(REDIS_URL)%'

        Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
            arguments:
                - '@Redis'
                - prefix: 'pideinfo_sess_'
                  ttl: 86400
