# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mail_from_address: '%env(MAIL_FROM_ADDRESS)%'
    mail_from_name: '%env(MAIL_FROM_NAME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'
            $s3Bucket: '%env(AWS_S3_BUCKET_NAME)%'
            League\Flysystem\FilesystemOperator $documentsStorage: '@documents.storage'
            League\Flysystem\FilesystemOperator $defaultStorage: '@default.storage'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Stripe billing: the key travels via env; empty = disabled (A5).
    # The remaining billing vars (Price ID, contact) are read by the services
    # that need them via explicit %env()% in their definitions.
    App\Billing\StripeClientFactory:
        arguments:
            $secretKey: '%env(default::STRIPE_SECRET_KEY)%'

    App\Billing\StripeWebhookVerifier:
        arguments:
            $webhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'

    # Stripe Price ID per (plan, interval). Empty = plan not purchasable
    # (checkout degrades to contact). Never hardcode Price IDs in code.
    App\Controller\BillingController:
        arguments:
            $prices:
                professional_month: '%env(default::STRIPE_PRICE_PRO_MONTH)%'
                professional_year: '%env(default::STRIPE_PRICE_PRO_YEAR)%'
                team_month: '%env(default::STRIPE_PRICE_TEAM_MONTH)%'
                team_year: '%env(default::STRIPE_PRICE_TEAM_YEAR)%'
                organization_month: '%env(default::STRIPE_PRICE_ORG_MONTH)%'
                organization_year: '%env(default::STRIPE_PRICE_ORG_YEAR)%'

    App\Controller\PricingController:
        arguments:
            $billingContactEmail: '%env(default::BILLING_CONTACT_EMAIL)%'

    # Effective-plan resolution: Doctrine by default (tests use a stub).
    App\Billing\ActiveSubscriptionProvider: '@App\Billing\DoctrineSubscriptionProvider'

    # AWS S3 Client for Flysystem
    aws_s3_client:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: '%env(AWS_S3_REGION)%'
              credentials:
                  key: '%env(AWS_S3_ACCESS_KEY_ID)%'
                  secret: '%env(AWS_S3_SECRET_ACCESS_KEY)%'
              http:
                  timeout: 10
              defaults_mode: 'standard'
              use_aws_shared_config_files: false

    Aws\S3\S3Client: '@aws_s3_client'

    # Markdown converter with GFM support (tables, strikethrough, etc.)
    League\CommonMark\MarkdownConverter:
        factory: ['App\Factory\MarkdownConverterFactory', 'create']

    twig.markdown.default:
        class: Twig\Extra\Markdown\LeagueMarkdown
        arguments:
            - '@League\CommonMark\MarkdownConverter'

    # OAuth2 discovery controller — needs the public key file path resolved
    App\Controller\OAuth2\DiscoveryController:
        arguments:
            $publicKeyPath: '%env(resolve:OAUTH_PUBLIC_KEY)%'
            $mcpEndpointPath: '/mcp'

    # OAuthTokenContext is request-scoped (one instance per request)
    App\Security\OAuth2\OAuthTokenContext:
        public: true

    # Resolution search: Elasticsearch first, Postgres as the safety net.
    App\Search\FallbackResolutionSearch:
        arguments:
            $elastic: '@App\Search\ElasticResolutionSearch'
            $doctrine: '@App\Search\DoctrineResolutionSearch'
            $backend: '%env(RESOLUTION_SEARCH_BACKEND)%'

    App\Search\ResolutionSearchInterface: '@App\Search\FallbackResolutionSearch'

    # Legislation search (index `laws`): same shape, same safety net.
    App\Search\FallbackLegislationSearch:
        arguments:
            $elastic: '@App\Search\ElasticLegislationSearch'
            $doctrine: '@App\Search\DoctrineLegislationSearch'
            $backend: '%env(LEGISLATION_SEARCH_BACKEND)%'

    App\Search\LegislationSearchInterface: '@App\Search\FallbackLegislationSearch'

    # Resolutions desk: the gate reads the shared passwords from the env.
    App\Service\Mesa\MesaAccessGate:
        arguments:
            $passwords: '%env(MESA_PASSWORDS)%'

    # CamoFox MCP client — browser automation for web search and URL visiting.
    # Uses a scoped HttpClient so it can reach the camofox-mcp container on the
    # Coolify network without affecting the default HttpClient used elsewhere.
    App\Service\AI\Camofox\CamofoxMcpClient:
        arguments:
            $endpoint: '%env(CAMOFOX_MCP_ENDPOINT)%'
            $apiKey: '%env(CAMOFOX_MCP_API_KEY)%'

    # Crawl4AI client — fast structured web scraping via headless Chromium.
    # Used by ScrapeUrlTool for one-shot URL extraction (markdown + links).
    # Proxy is configured server-side in Crawl4AI's config.yml (Coolify volume).
    App\Service\AI\Crawl4ai\Crawl4aiClient:
        arguments:
            $endpoint: '%env(CRAWL4AI_ENDPOINT)%'
            $apiToken: '%env(CRAWL4AI_API_TOKEN)%'

    # Second OpenAI-compatible client instance pointing at the TEACHER model.
    # Only used by AgentModelRouter to serve turns with the teacher while
    # collecting distillation traces. The connection opens lazily, so with an
    # empty TEACHER_MODEL_ENDPOINT this service contacts nobody.
    # Shares the `llm_api` limiter on purpose: when the teacher is served from
    # the same self-hosted endpoint, the global budget must stay one.
    app.custom_model_client.teacher:
        class: App\Service\AI\CustomModelClient
        arguments:
            $model: '%env(TEACHER_MODEL)%'
            $endpoint: '%env(TEACHER_MODEL_ENDPOINT)%'
            $apiKey: '%env(TEACHER_MODEL_API_KEY)%'
            $maxTokens: '%env(int:TEACHER_MODEL_MAX_TOKENS)%'
            # No `float:` on purpose: empty means "unset" and CustomModelClient
            # treats it as such, omitting `temperature` from the request instead of sending 0.0.
            $temperature: '%env(TEACHER_MODEL_TEMP)%'
            $logger: '@logger'
            $llmApiLimiter: '@limiter.llm_api'
            # Anthropic's OpenAI-compat layer requires `strict: true` on every
            # response_format.json_schema. Only DECISION_SCHEMA/PLAN_SCHEMA
            # (AgentChatOrchestrator) are ever sent through this client with a
            # schema, and both are kept strict-mode compliant for that reason.
            $strictJsonSchema: true

when@prod:
    services:
        Redis:
            class: \Predis\Client
            arguments:
                - '%env(REDIS_URL)%'

        Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
            arguments:
                - '@Redis'
                - prefix: 'pideinfo_sess_'
                  ttl: 86400
