doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '17'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        mapping_types:
            halfvec: string
            vector: string
        options:
            !php/const PDO::ATTR_STRINGIFY_FETCHES: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        dql:
            string_functions:
                CAST: App\Doctrine\CastFunction
                UNACCENT: App\Doctrine\UnaccentFunction
                JSONB_CONTAINS: App\Doctrine\JsonbContainsFunction
            numeric_functions:
                DAYS_BETWEEN: App\Doctrine\DaysBetweenFunction
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # TEST_DB_SUFFIX defaults to `_test` in .env (a fixture database, the usual thing).
            # Emptying it in .env.test.local points the test run at the real corpus instead —
            # which is what makes the end-to-end probes over the live corpus possible here.
            # "TEST_TOKEN" is typically set by ParaTest.
            dbname_suffix: '%env(default::TEST_DB_SUFFIX)%%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
