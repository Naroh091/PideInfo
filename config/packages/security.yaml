security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        oauth_token:
            pattern: ^/oauth2/token$
            security: false
        oauth_register:
            pattern: ^/oauth2/register$
            security: false
        oauth_well_known:
            pattern: ^/\.well-known/(oauth-|jwks)
            security: false
        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\OAuth2\McpAuthenticationEntryPoint
            access_token:
                token_handler: App\Security\OAuth2\OAuth2TokenHandler
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /panel
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/og-image, roles: PUBLIC_ACCESS }
        - { path: ^/registro, roles: PUBLIC_ACCESS }
        - { path: ^/verificar, roles: PUBLIC_ACCESS }
        - { path: ^/recuperar-password, roles: PUBLIC_ACCESS }
        - { path: ^/webhook/, roles: PUBLIC_ACCESS }
        - { path: ^/guias/privacidad, roles: PUBLIC_ACCESS }
        - { path: ^/resoluciones, roles: PUBLIC_ACCESS }
        # Mesa de resoluciones (herramienta interna CTBG): puerta propia por
        # contraseña compartida (MesaAccessGate), no cuentas de PideInfo.
        - { path: ^/mesa-resoluciones, roles: PUBLIC_ACCESS }
        - { path: ^/\.well-known/(oauth-|jwks), roles: PUBLIC_ACCESS }
        - { path: ^/oauth2/(token|register)$, roles: PUBLIC_ACCESS }
        - { path: ^/oauth2/authorize, roles: ROLE_USER }
        # Redacción pública sin registro: /redactar y el chat SSE compartido.
        # El acceso real por entidad lo decide AccessRequestVoter (dueño, o
        # sesión anónima que creó el borrador).
        - { path: ^/redactar, roles: PUBLIC_ACCESS }
        - { path: ^/asistente/, roles: PUBLIC_ACCESS }
        - { path: ^/mcp, roles: ROLE_USER }
        - { path: ^/api/, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
