framework:
    rate_limiter:
        # Global budget for the self-hosted model API key, shared by chat
        # (analysis + vision OCR) AND embeddings (vectorization) because they hit
        # the same endpoint/key. token_bucket (not sliding_window) so callers can
        # reserve()->wait() and block until a slot frees up. Refill 1/s = 60 rpm
        # sustained; `limit` is the small burst allowance. cache_pool must be the
        # Redis pool so the bucket is shared across all worker processes.
        llm_api:
            policy: token_bucket
            limit: 6
            rate: { interval: '1 second', amount: 1 }
            cache_pool: cache.app

        inbound_email:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        AGENT:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        oauth_token:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        oauth_register:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # Formulario de propuesta del plan Privado (/precios/privado).
        # Keyed by client IP; el CAPTCHA Turnstile es la otra pata.
        private_proposal:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        mcp_call:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

        # Public drafting without registration (/redactar). Keyed by client IP.
        anonymous_draft_create:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        anonymous_chat_turn:
            policy: sliding_window
            limit: 15
            interval: '10 minutes'

        # Moderation strikes per IP: once this many anonymous turns are blocked by
        # the moderation guard, the IP is cut from creating drafts and chatting.
        anonymous_moderation_strikes:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

        # Global circuit breaker for anonymous generation: total turns/day across
        # ALL IPs, so distributed abuse can't outrun the per-IP limits. Not keyed
        # by IP (consumed with a constant 'global' key); cache_pool is the Redis
        # pool so the counter is shared across every worker process.
        anonymous_generation_global:
            policy: sliding_window
            limit: '%env(int:ANON_GEN_DAILY_BUDGET)%'
            interval: '1 day'
            cache_pool: cache.app

when@test:
    # No Redis in test (the real pool fails open): the proposal limiter uses
    # an in-memory ArrayAdapter so it stays verifiable.
    # Identical semantics (sliding window 5/hour); only the backend changes.
    services:
        test.private_proposal_pool:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter

    framework:
        rate_limiter:
            private_proposal:
                cache_pool: test.private_proposal_pool
