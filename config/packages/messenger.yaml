framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            analysis:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: analysis
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            mail:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: mail
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - 'App\Messenger\UserContextMiddleware'
                    - 'App\Messenger\TracingMiddleware'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: mail
            Symfony\Component\Notifier\Message\ChatMessage: mail
            Symfony\Component\Notifier\Message\SmsMessage: mail
            App\Message\ProcessDocumentMessage: analysis
            App\Message\ProcessDocumentBatchMessage: analysis
            App\Message\CheckCustomDeadlinesMessage: async
            App\Message\ProcessResolutionMessage: async
            App\Message\UpdateExpiredRequestsMessage: async
